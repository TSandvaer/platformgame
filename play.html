<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game - Platform Game Portal</title>
    <link rel="stylesheet" href="/css/base.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .player-header {
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
        }

        .game-info-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-title-header {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .game-author-header {
            font-size: 14px;
            color: #888;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #3a3a3a;
        }

        .btn-secondary:hover {
            background: #4a4a4a;
        }

        .game-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        canvas {
            border: 2px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #3a3a3a;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-container {
            text-align: center;
            padding: 60px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .error-container h2 {
            color: #ff6b6b;
            margin: 0 0 15px 0;
        }

        .error-container p {
            color: #aaa;
            margin-bottom: 25px;
        }

        .fullscreen-btn {
            background: #3a3a3a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .fullscreen-btn:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div class="player-header">
        <div class="game-info-header">
            <h1 class="game-title-header" id="gameTitle">Loading...</h1>
            <span class="game-author-header">by <span id="gameAuthor">...</span></span>
        </div>
        <div class="header-actions">
            <button id="fullscreenBtn" class="btn btn-secondary">⛶ Fullscreen</button>
            <a href="gallery.html" class="btn btn-secondary">📚 Browse Games</a>
            <a href="index.html" class="btn">📝 Create Your Own</a>

    </div>

        <div id="loadingContainer" class="loading-container">

            <h2>⚠️ Game Not Found</h2>
            <p id="errorMessage">This game does not exist or is not published.</p>
            <a href="gallery.html" class="btn">Browse Other Games</a>

    <!-- Prevent default game initialization -->

    <!-- Main Game Engine -->

    <!-- Player Game Controller -->

    <!-- Player App Script -->
    <script>
        // Player Application
        // Loads and plays published games without editor functionality

        class GamePlayer {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.game = null;
                this.baseURL = 'http://localhost:3000/api';

                this.loadGameFromURL();
            }

            async loadGameFromURL() {
                try {
                    // Parse URL path: /play/username/gameslug
                    const path = window.location.pathname;
                    const match = path.match(/\/play\/([^\/]+)\/([^\/]+)/);

                    if (!match) {
                        this.showError('Invalid game URL');
                        return;
                    }

                    const username = match[1];
                    const slug = match[2];

                    // Get token from query string if present (for private games)
                    const urlParams = new URLSearchParams(window.location.search);
                    const token = urlParams.get('token');

                    document.getElementById('loadingMessage').textContent = `Loading ${slug}...`;

                    // Fetch game data
                    const url = `${this.baseURL}/games/play/${username}/${slug}${token ? `?token=${token}` : ''}`;
                    const response = await fetch(url);

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || 'Game not found');
                    }

                    const data = await response.json();

                    // Track play
                    this.trackGamePlayed(username, slug);

                    // Load game
                    this.startGame(data.game, data.author);

                } catch (error) {
                    console.error('Error loading game:', error);
                    this.showError(error.message);
                }
            }

            async trackGamePlayed(username, slug) {
                try {
                    await fetch(`${this.baseURL}/games/play/${username}/${slug}/played`, {
                        method: 'POST'
                    });
                } catch (error) {
                    console.error('Error tracking play:', error);
                }
            }

            startGame(gameData, author) {
                // Update header
                document.getElementById('gameTitle').textContent = gameData.name;
                document.getElementById('gameAuthor').textContent = author.displayName || author.username;

                // Hide loading, show canvas
                document.getElementById('loadingContainer').style.display = 'none';
                this.canvas.style.display = 'block';

                // Initialize game (using existing game.js structure)
                // We need to adapt the existing game code to work here
                // For now, show placeholder
                console.log('🎯 Game data loaded from server:', gameData);
                console.log('🎯 Inner gameData:', gameData.gameData);
                console.log('🎯 HUD settings from server:', gameData.gameData?.gameSettings?.hud);

                // Start the game
                this.initializeGame(gameData.gameData);
            }

            initializeGame(gameData) {
                try {
                    console.log('Initializing game with data:', gameData);

                    // Prevent the default game.js DOMContentLoaded initialization
                    // We'll handle initialization ourselves

                    // Initialize the game using PlayerGameController
                    this.gameController = new PlayerGameController(this.canvas, gameData);
                    this.game = this.gameController.getGame();

                    console.log('Game initialized successfully!');
                } catch (error) {
                    console.error('Error initializing game:', error);
                    this.ctx.fillStyle = '#1a1a1a';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    this.ctx.fillStyle = '#ff6b6b';
                    this.ctx.font = '24px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Failed to load game', this.canvas.width / 2, this.canvas.height / 2 - 40);

                    this.ctx.font = '16px Arial';
                    this.ctx.fillStyle = '#888';
                    this.ctx.fillText(error.message, this.canvas.width / 2, this.canvas.height / 2);
                }
            }

            showError(message) {
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('errorContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = message;
            }
        }

        // Fullscreen functionality
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const canvas = document.getElementById('gameCanvas');
            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            } else if (canvas.webkitRequestFullscreen) {
                canvas.webkitRequestFullscreen();
            } else if (canvas.msRequestFullscreen) {
                canvas.msRequestFullscreen();
            }
        });

        // Initialize player
        const player = new GamePlayer();
    </script>
