# DigitalOcean App Platform Configuration
# This file defines how your Platform RPG Game should be deployed on DigitalOcean
# See: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: platform-rpg-game
region: nyc

# Services
services:
  - name: web
    # GitHub repository configuration
    github:
      repo: TSandvaer/platformgame
      branch: master
      deploy_on_push: true

    # Build configuration
    build_command: npm install --production

    # Run configuration
    run_command: npm start

    # Environment variables (set these in DigitalOcean dashboard for security)
    envs:
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        # Set this in DigitalOcean App Platform dashboard
        # Do NOT commit actual MongoDB URI to git

      - key: PORT
        scope: RUN_TIME
        value: "8080"
        # DigitalOcean uses port 8080 by default

      - key: DB_NAME
        scope: RUN_TIME
        value: "platformGameDB"

      - key: FIREBASE_PROJECT_ID
        scope: RUN_TIME
        type: SECRET
        # Set this in DigitalOcean App Platform dashboard

      - key: FIREBASE_CLIENT_EMAIL
        scope: RUN_TIME
        type: SECRET
        # Set this in DigitalOcean App Platform dashboard

      - key: FIREBASE_PRIVATE_KEY
        scope: RUN_TIME
        type: SECRET
        # Set this in DigitalOcean App Platform dashboard
        # Remember to include quotes and \n escape sequences

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # HTTP configuration
    http_port: 8080

    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xxs
    # Options: basic-xxs, basic-xs, basic-s, basic-m
    # basic-xxs: $5/month (512MB RAM, 1 vCPU)
    # basic-xs: $12/month (1GB RAM, 1 vCPU)

    # Routes (HTTP paths)
    routes:
      - path: /

    # Source directory (use root of repo)
    source_dir: /

